# Base go2rtc configuration. Aperture (nvrd) manages individual camera streams
# dynamically through the go2rtc API, so the `streams:` block is intentionally
# left for go2rtc to populate at runtime.

api:
  # Under Docker, nvrd reaches this API across the container bridge, so it cannot
  # be bound to 127.0.0.1 here. It hands out camera passwords to anyone who can
  # reach it: firewall port 1984 off the LAN. The native install (deploy/install.sh)
  # binds it to 127.0.0.1 instead.
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  candidates:
    # Let go2rtc discover a routable address via STUN (works for most setups).
    - stun:8555
    # For a pure-LAN deployment, also add your host's LAN IP so browsers on the
    # same network can connect directly, e.g.:
    # - 192.168.1.50:8555

log:
  level: info
  # The streams module logs a stream's full source URL (password included) with
  # every reconnect warning. Keep it to errors.
  streams: error
