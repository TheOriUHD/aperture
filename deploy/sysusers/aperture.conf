# Base identity for extension children. Per-extension uids are allocated
# numerically from 65600 by internal/api/ext_handlers.go and deliberately do NOT
# get passwd entries; this is only the shared base/group.
# The group MUST be declared before the user: `u name uid:gid` does not create
# the gid, it requires it to already exist ("please create GID 65533" otherwise),
# and sysusers exits 0 anyway — so a missing g line fails silently.
g aperture-ext 65533
u aperture-ext 65533:65533 "Aperture extension sandbox" /var/lib/aperture/ext /usr/sbin/nologin
u aperture-go2rtc - "Aperture go2rtc broker" - /usr/sbin/nologin
