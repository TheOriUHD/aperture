services:
  nvrd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aperture/nvrd:latest
    container_name: aperture-nvrd
    restart: unless-stopped
    # Container-level backstop for a runaway backend extension. The per-extension
    # V8 heap cap + oom_score_adj make an extension die first; these bound the whole
    # cgroup (nvrd + ffmpeg + extensions) as a last resort. Sized ~10x current
    # usage (~210 MiB / 8% CPU / 62 PIDs on a 4-core host) so recording is never
    # starved. Applied only on container recreate, not a plain restart.
    mem_limit: 2g
    pids_limit: 1024
    cpus: "3.0"
    depends_on:
      - go2rtc
      - mosquitto
    ports:
      # Host port is overridable: set APERTURE_PORT in deploy/.env (default 8971).
      - "${APERTURE_PORT:-8971}:8080"     # web UI + API
    volumes:
      - ./data:/data          # SQLite, secrets, runtime config
      - ./recordings:/recordings
    environment:
      APERTURE_HTTP_ADDR: ":8080"         # internal container port (do not change)
      APERTURE_URL: "http://localhost:8080" # so in-container `nvrctl` reaches the API
      APERTURE_DATA_DIR: "/data"
      APERTURE_RECORDINGS_DIR: "/recordings"
      # go2rtc runs on the host network (so WebRTC advertises real LAN IPs);
      # nvrd reaches it through the Docker host gateway.
      APERTURE_GO2RTC_URL: "http://host.docker.internal:1984"
      APERTURE_GO2RTC_RTSP: "rtsp://host.docker.internal:8554"
      # Address EXTERNAL consumers (a player, Home Assistant, a VMS) use to reach
      # go2rtc's RTSP/snapshot ports. Set this to your host's LAN IP (e.g. 192.168.1.50)
      # whenever you open Aperture through a reverse proxy or domain — the proxy forwards
      # the web UI but NOT the raw RTSP port, so the advertised rtsp:// URL must name the
      # LAN address go2rtc actually listens on. Empty = use the host you opened the UI on
      # (fine only when that is a directly-reachable IP). Set in deploy/.env.
      APERTURE_STREAM_HOST: "${APERTURE_STREAM_HOST:-}"
      APERTURE_MQTT_URL: "tcp://mosquitto:1883"
      # Public base URL used to build stream URLs handed to browsers / Home Assistant.
      APERTURE_PUBLIC_URL: "${APERTURE_PUBLIC_URL:-http://localhost:8971}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [aperture]

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: aperture-go2rtc
    restart: unless-stopped
    # Host networking lets go2rtc's WebRTC offer the server's real LAN address,
    # which browsers and Home Assistant on the network can actually reach.
    # Publishes 1984 (API/MSE/HLS), 8554 (RTSP restream), 8555 (WebRTC) on the host.
    network_mode: host
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aperture-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto:/mosquitto/data
    networks: [aperture]

networks:
  aperture:
    driver: bridge
