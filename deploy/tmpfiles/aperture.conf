# Aperture state layout. 0711 on the data root is deliberate: traversable so an
# extension child can reach /var/lib/aperture/ext/<id>, NOT listable so it cannot
# enumerate siblings or the rest of the tree.
d /var/lib/aperture            0711 root root -
d /var/lib/aperture/ext        0711 root root -
d /var/lib/aperture/recordings 0755 root root -
d /var/lib/aperture/exports    0700 root root -
d /var/lib/aperture/spool      0700 root root -
d /var/lib/aperture/frame-cache 0700 root root -
d /var/lib/aperture/rcache     0700 root root -
d /var/lib/aperture/homekit    0700 root root -
d /etc/aperture                0755 root root -
