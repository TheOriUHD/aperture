# Aperture state layout. 0711 on the data root is deliberate: traversable so an
# extension child can reach /var/lib/aperture/ext/<id>, NOT listable so it cannot
# enumerate siblings or the rest of the tree.
# recordings/ is a SIBLING of data/, never a child: the janitor counts
# dirBytes(data dir) as app overhead against the storage cap, so nesting the
# footage inside it makes the cap target negative and wipes every recording.
d /var/lib/aperture                 0755 root root -
d /var/lib/aperture/data            0711 root root -
d /var/lib/aperture/data/ext        0711 root root -
d /var/lib/aperture/data/exports    0700 root root -
d /var/lib/aperture/data/spool      0700 root root -
d /var/lib/aperture/data/frame-cache 0700 root root -
d /var/lib/aperture/data/rcache     0700 root root -
d /var/lib/aperture/data/homekit    0700 root root -
d /var/lib/aperture/recordings      0755 root root -
d /etc/aperture                0755 root root -
