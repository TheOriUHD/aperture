<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room light</title>
  <!--
    A panel is a sandboxed, opaque-origin iframe: it cannot inherit the host app's
    stylesheet or load any external resource (the per-panel CSP allows inline
    <style>/<script> only), so it brings its own styling; the tokens below mirror
    Aperture's dark theme (docs/extensions/panels.md) and the body is transparent so it
    reads as part of the camera-detail card.

    What this demonstrates — the point of a panel: it reacts to the camera on screen
    (window.aperture.cameraId), looks that camera up in a camera→light mapping the user
    configured in settings, and toggles that light in Home Assistant. The server URL is a
    `url` setting (and the extension's only allowed network host — see the manifest's
    {{setting:ha_url}}), the token is a write-only `secret` injected server-side via a
    {{secret:ha_token}} placeholder the panel never sees, and outbound failures are shown
    as a plain sentence with the raw error tucked behind "Details".
  -->
  <style>
    :root {
      color-scheme: dark;
      --fg: #eef0f2; --fg-muted: #8b9199; --fg-faint: #6c727a;
      --surface: #101319; --line: #20242b; --line-strong: #2c3138;
      --amber: #e6b45a; --danger: #f0494e; --radius: 10px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; background: transparent; color: var(--fg);
           font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .glyph { flex: none; width: 34px; height: 34px; display: grid; place-items: center;
             border-radius: 9px; background: #16202b; color: var(--fg-faint);
             border: 1px solid var(--line-strong); transition: background .15s, color .15s; }
    .glyph.on { background: rgba(230,180,90,.16); color: var(--amber); }
    .title { margin: 0; font-size: 13px; font-weight: 600; }
    .subtitle { margin: 1px 0 0; font-size: 11px; color: var(--fg-muted); }
    .control { display: flex; align-items: center; justify-content: space-between; gap: 12px;
               padding: 12px 14px; border-radius: var(--radius);
               background: var(--surface); border: 1px solid var(--line); }
    .state { font-size: 13px; } .state b { color: var(--fg); } .state .muted { color: var(--fg-muted); }
    .toggle { appearance: none; border: 0; cursor: pointer; position: relative;
              width: 52px; height: 30px; border-radius: 999px; background: var(--line-strong);
              transition: background .18s; flex: none; }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
                     border-radius: 50%; background: #fff; transition: transform .18s; }
    .toggle[aria-checked="true"] { background: var(--amber); }
    .toggle[aria-checked="true"]::after { transform: translateX(22px); }
    .toggle[disabled] { opacity: .5; cursor: default; }
    .note { margin: 10px 2px 0; font-size: 11.5px; line-height: 1.5; color: var(--fg-faint); }
    .note.error { color: var(--danger); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--fg-muted); }
    details { margin-top: 6px; } summary { cursor: pointer; color: var(--fg-faint); font-size: 11px; }
    details pre { margin: 6px 0 0; padding: 8px; border-radius: 8px; background: var(--surface);
                  border: 1px solid var(--line); color: var(--fg-muted); font-size: 10.5px;
                  white-space: pre-wrap; word-break: break-word; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="head">
    <div class="glyph" id="glyph" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18h6M10 21h4M12 2a6 6 0 0 0-4 10.5c.7.7 1 1.2 1 2.5h6c0-1.3.3-1.8 1-2.5A6 6 0 0 0 12 2Z"/>
      </svg>
    </div>
    <div>
      <p class="title">Room light</p>
      <p class="subtitle" id="subtitle">Loading…</p>
    </div>
  </div>

  <div class="control hidden" id="control">
    <span class="state" id="state"><span class="muted">Checking…</span></span>
    <button class="toggle" id="toggle" role="switch" aria-checked="false" aria-label="Toggle light" disabled></button>
  </div>

  <p class="note" id="note"></p>
  <details class="hidden" id="details"><summary>Details</summary><pre id="detailText"></pre></details>

  <script>
    (function () {
      var ap = window.aperture;
      var els = {
        subtitle: document.getElementById('subtitle'), control: document.getElementById('control'),
        state: document.getElementById('state'), toggle: document.getElementById('toggle'),
        glyph: document.getElementById('glyph'), note: document.getElementById('note'),
        details: document.getElementById('details'), detailText: document.getElementById('detailText')
      };
      var cameraId = ap && ap.cameraId;
      var haUrl = null, entity = null, isOn = false, busy = false;

      function resize() { if (ap && ap.resize) ap.resize(document.documentElement.scrollHeight); }
      function say(text, isError, detail) {
        els.note.textContent = text || ''; els.note.className = 'note' + (isError ? ' error' : '');
        if (detail) { els.detailText.textContent = detail; els.details.classList.remove('hidden'); }
        else { els.details.classList.add('hidden'); }
        resize();
      }
      function setOn(on) {
        isOn = on; els.toggle.setAttribute('aria-checked', on ? 'true' : 'false');
        els.glyph.className = 'glyph' + (on ? ' on' : '');
        els.state.innerHTML = on ? '<b>On</b>' : '<span class="muted">Off</span>';
      }

      // A Home Assistant call through the host: the token is injected server-side from
      // the {{secret:ha_token}} placeholder — the panel never holds it. Returns the
      // upstream response, or handles a connection failure with a legible message.
      function ha(method, path, body) {
        return ap.net.fetch(haUrl + path, {
          method: method,
          headers: { Authorization: 'Bearer {{secret:ha_token}}', 'Content-Type': 'application/json' },
          body: body
        }).then(function (r) {
          if (r.status === 0) { say(r.error, true, r.detail); return null; }        // connection failure
          if (r.status === 401) { say('Home Assistant rejected the token — check it in this extension’s settings.', true); return null; }
          if (r.status === 404) { say('No entity ' + entity + ' in Home Assistant — check the mapping in settings.', true); return null; }
          return r;
        }).catch(function (e) {
          // Client-side problems (URL unconfigured, host not allowed) reject with a
          // ready-made message.
          say((e && e.message) || 'Could not reach Home Assistant.', true);
          return null;
        });
      }

      els.toggle.addEventListener('click', function () {
        if (busy || els.toggle.disabled) return;
        busy = true; els.toggle.disabled = true;
        var next = !isOn;
        ha('POST', '/api/services/light/' + (next ? 'turn_on' : 'turn_off'), JSON.stringify({ entity_id: entity }))
          .then(function (r) { if (r) { setOn(next); say('Turned the light ' + (next ? 'on' : 'off') + '.'); } })
          .then(function () { busy = false; els.toggle.disabled = false; });
      });

      (async function init() {
        if (!cameraId) { els.subtitle.textContent = 'Open a camera to control its light.'; resize(); return; }

        try { var cam = await ap.cameras.get(cameraId); els.subtitle.textContent = (cam && cam.name) || cameraId; }
        catch (e) { els.subtitle.textContent = cameraId; }

        haUrl = await ap.settings.get('ha_url');
        var mapping = (await ap.settings.get('lights')) || [];   // [{camera, entity}, …]
        var row = mapping.filter(function (m) { return m.camera === cameraId; })[0];
        entity = row && row.entity;

        if (!haUrl) { say('Set your Home Assistant URL in this extension’s settings to begin.', true); return; }
        if (!entity) { say('No light is mapped to this camera yet. Add a Camera → light row in the extension’s settings.', true); return; }

        els.control.classList.remove('hidden');
        say('Controls ' + entity + '.');

        var r = await ha('GET', '/api/states/' + encodeURIComponent(entity));
        if (r && r.body) { try { setOn(JSON.parse(r.body).state === 'on'); } catch (e) {} }
        els.toggle.disabled = false;
        resize();
      })();
    })();
  </script>
</body>
</html>
